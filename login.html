<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e3e1dc;
          --primary: #1d1d1f; --primary-ink: #fff; --accent: #d93a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #202020; --ink: #f2f2f2; --muted: #a0a0a5; --line: #333;
            --primary: #f2f2f2; --primary-ink: #161616; --accent: #ff5a4a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display: grid; place-items: center; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
         border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 12px; width: 100%; }
  button { font: inherit; font-weight: 600; border-radius: 999px; padding: 10px; cursor: pointer;
           border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); }
  .err { color: var(--accent); font-size: 14px; min-height: 1.4em; margin: 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <input type="password" name="password" placeholder="Password" autofocus required>
  <p class="err"><!--error--></p>
  <button type="submit">Enter</button>
  <footer>Originated by Project Harrison</footer>
</form>
</body>
</html>
